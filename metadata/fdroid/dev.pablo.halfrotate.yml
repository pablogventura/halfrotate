Name: HalfRotate
Summary: Limit auto-rotate to chosen orientations without flicker
Description: |-
  HalfRotate filters Android system auto-rotation to the orientations you choose:
  portrait + landscape (default), portrait only, landscape only, or all except upside down.

  While the filter is active, system auto-rotate is locked and HalfRotate rotates directly
  between allowed orientations — no flash through blocked angles.

  Optional "force auto-rotation" keeps rotating between allowed orientations even if
  system auto-rotate was off when you enabled the filter.

  No root required. No ads. No tracking. GPL-3.0-or-later.

  Requires the "Modify system settings" permission to adjust rotation. A foreground
  service runs only while the filter is active, with a visible notification.

