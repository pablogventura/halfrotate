Name: HalfRotate
Summary: Limit auto-rotate to portrait and landscape only
Description: |-
  HalfRotate keeps Android auto-rotation enabled but blocks upside-down (180°)
  and reverse landscape (270°) orientations. Only portrait (0°) and landscape
  (90°) are allowed.

  No root required. No ads. No tracking. GPL-3.0-or-later.

  Requires the "Modify system settings" permission to adjust rotation. A foreground
  service runs only while the filter is active, with a visible notification.

  If system auto-rotate is turned off manually, HalfRotate respects that and
  pauses corrections until auto-rotate is enabled again.

